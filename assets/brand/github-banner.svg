<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">ShiftLedger — Your shifts and pay, kept on your device</title><desc id="desc">An offline-first ledger of shifts, weekly overtime and estimated pay that stores everything in your browser. By OBEOS.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
