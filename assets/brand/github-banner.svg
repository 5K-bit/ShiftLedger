<text x="106" y="46" fill="#c5cddb" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">BY OBEOS</text>
<text x="48" y="114" fill="#a3e635" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">WORKFORCE / 08</text>
<text x="45" y="194" fill="#f3f5fa" font-family="Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">ShiftLedger</text>
<text x="48" y="247" fill="#e0e6ef" font-family="Arial, sans-serif" font-size="25">Your shifts and pay, kept on your device</text>
<text x="48" y="285" fill="#99a7bc" font-family="Arial, sans-serif" font-size="21">Log hours, see weekly overtime, export a CSV. Works offline. Nothing is uploaded.</text>
