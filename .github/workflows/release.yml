name: Release

# A tag publishes nothing until the full CI suite (lint, types, unit and browser tests) has
# passed on the tagged commit and the tagged commit is on main.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: validate (lint, types, unit and browser tests)
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${version}"; exit 1; }
      - name: Check release notes exist for this tag
        run: test -s "docs/releases/${GITHUB_REF_NAME}.md"
      - run: npm run build
      - name: Package and checksum
        run: |
          mkdir release
          (cd dist && zip -r -X "../release/shiftledger-${GITHUB_REF_NAME}.zip" .)
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Decide whether this is a prerelease
        id: pre
        run: |
          if [[ "${GITHUB_REF_NAME}" == v0.* || "${GITHUB_REF_NAME}" == *-* ]]; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo "value=false" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: ${{ steps.pre.outputs.value }}
